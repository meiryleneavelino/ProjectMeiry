name: horus-governance
# Only the API runs here. SAST analysis no longer runs on this host: each
# organization's sast-agent runs it in its own Kubernetes namespace, and no
# container in this file mounts the Docker socket.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: horus-governance:local
    container_name: horus-governance-api
    user: "${HORUS_UID:-1000}:${HORUS_GID:-1000}"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    tmpfs: ["/tmp:rw,noexec,nosuid,nodev,size=67108864,mode=1777"]
    mem_limit: 384m
    pids_limit: 128
    ports: ["127.0.0.1:8097:8097"]
    environment:
      HORUS_STATE_ROOT: /state
      HORUS_SETTINGS: /app/config/settings.example.json
      HORUS_TRAINING_URL: http://host.docker.internal:8096/api/v1/ml
      HORUS_TRAINING_TOKEN_FILE: /run/secrets/training-token
      # Researcher gateway of the Fabric ledger (python3 tools.py ledger forward).
      HORUS_LEDGER_URL: http://host.docker.internal:8098
      HORUS_LEDGER_TOKEN_FILE: /state/ledger/gateway-token
    volumes:
      - ./.local:/state
      - ./config/settings.example.json:/app/config/settings.example.json:ro
      - type: bind
        source: ../configuration/federated-training/.local/api-token
        target: /run/secrets/training-token
        read_only: true
        bind:
          create_host_path: false
    extra_hosts: ["host.docker.internal:host-gateway"]
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health',timeout=3)"]
      interval: 5s
      timeout: 4s
      retries: 12
